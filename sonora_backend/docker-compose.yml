version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sonora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: sonora_secure_password
      POSTGRES_DB: sonora_db
    volumes:
      - sonora_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonora -d sonora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  sonora_backend:
    build: .
    container_name: sonora_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIND_HOST: "127.0.0.1"
      BIND_PORT: "8000"
      DATABASE_URL: "postgresql+psycopg2://sonora:sonora_secure_password@postgres:5432/sonora_db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-sonora-local-jwt-secret}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      LUCIDADL_BIN: "/usr/local/bin/lucidadl"
      DOWNLOAD_DIR: "/sdcard/Music"
      MAX_CONCURRENT_JOBS: "2"
    volumes:
      - ./downloads:/sdcard/Music
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  sonora_pgdata:
